[project]
name = "dora-mcp"
version = "0.1.0"
description = "DORA metrics from GitHub data as a DuckDB star schema, served over MCP"
readme = "README.md"
authors = [
    { name = "Reza Rahimi", email = "rezarahimiderimi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
dora-mcp = "dora_mcp:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
